<!DOCTYPE html>
<html lang="nl">
<head>
    <title>Color</title>
    <link rel="stylesheet" href="CSS/style1.css">
</head>
<body>
<div id="colorpicker">
    <div id="sliders">
        <span>0</span>
        <input type="range" class="slider" id="sliderR" min="0" max="255" value="0">
        <span>255</span>
        <span>Red</span>
        <span class="sliderValue" id="valueR">0</span>

        <span>0</span>
        <input type="range" class="slider" id="sliderG" min="0" max="255" value="0">
        <span>255</span>
        <span>Green</span>
        <span class="sliderValue" id="valueG">0</span>

        <span>0</span>
        <input type="range" class="slider" id="sliderB" min="0" max="255" value="0">
        <span>255</span>
        <span>Blue</span>
        <span class="sliderValue" id="valueB">0</span>
    </div>

    <div class="colorDemo" id="colorDemo"></div>
    <button id="saveBtn">Save</button>
    <button id="clearBtn">Clear</button>
</div>

<div id="savedColors"></div>

<script src="scripts/oefening_1.js"></script>
</body>
</html>
